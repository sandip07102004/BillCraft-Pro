name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Web Assets to Android
        run: |
          node sync-web.js
          npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./BillCraft-Pro.apk
          ls -lh BillCraft-Pro.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillCraft-Pro-APK
          path: BillCraft-Pro.apk

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "BillCraft Pro v1.0.1 (APK Update)"
          body: |
            ### 🚀 BillCraft Pro v1.0.1 - Android APK & Web Release

            #### 🛠️ Fixes & Enhancements:
            - **Fixed PDF Export on Android APK:** Integrated `@capacitor/filesystem` and `@capacitor/share` to reliably save and trigger the native Android Share & Print sheet.
            - **100% Offline PDF Generation:** Bundled `html2pdf.bundle.min.js` locally inside the application package, eliminating external CDN dependencies and network timeout issues in Android WebView.
            - **Storage Permission Handling:** Added automatic fallback to application cache directory if device document storage permissions are restricted.
          files: BillCraft-Pro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
